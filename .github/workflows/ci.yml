name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: corepack enable
      - run: corepack prepare npm@11.6.2 --activate
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
